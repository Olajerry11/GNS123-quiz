<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JABU GNS 123 Objective Quiz Application">
    <title>JABU Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <img src="Jabu logo.png" alt="JABU Logo" class="logo" onerror="this.style.display='none'">
            <h1>GNS 123 Objective Quiz</h1>
        </header>
        
        <main id="app-main">
            <div id="loading-state" class="state-container">
                <p>Loading quiz data...</p>
            </div>

            <div id="error-state" class="state-container hidden">
                <h2>Error Loading Quiz</h2>
                <p>There was a problem parsing the quiz data. Please ensure the format is correct.</p>
                <div id="error-details"></div>
            </div>

            <div id="quiz-state" class="state-container hidden">
                <div class="progress-container">
                    <span id="question-counter">Question 1 of X</span>
                    <span id="score-display">Score: 0</span>
                </div>
                
                <div class="question-container">
                    <h2 id="question-text">Question text goes here</h2>
                    <div id="options-container" class="options-container">
                        <!-- Options will be injected here -->
                    </div>
                </div>

                <div class="controls-container">
                    <button id="next-btn" class="primary-btn hidden">Next Question</button>
                </div>
            </div>

            <div id="results-state" class="state-container hidden">
                <h2>Quiz Completed!</h2>
                <p class="final-score">Your Score: <span id="final-score-value">0</span> / <span id="total-questions-value">0</span></p>
                <button id="restart-btn" class="primary-btn">Restart Quiz</button>
            </div>
        </main>
    </div>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
